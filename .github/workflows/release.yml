name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/netmon_widget.exe dist/netmon_widget.exe
          Compress-Archive -Path dist/netmon_widget.exe, LICENSE, README.md, README.ru.md, README.hr.md, netmon_widget.example.toml -DestinationPath dist/netmon_widget-win64.zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/netmon_widget-win64.zip
            dist/netmon_widget.exe
          generate_release_notes: true
